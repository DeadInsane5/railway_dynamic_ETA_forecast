[project]
name = "dynamic-eta-forecast-prototype"
version = "0.1.0"
description = "SIH26028 dynamic ETA forecast prototype (simulated data only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "networkx>=3.2",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
